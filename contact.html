<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteystiedot - VeneKauppa Oy</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">⚓ Venekauppa Oy</a>

      <nav>
        <a href="index.html">Etusivu</a>
      </nav>
    </header>

    <main class="contact-container">
      <h1>Ota yhteyttä</h1>
      <p>
        Onko sinulla kysyttävää veneistämme? Lähetä meille viesti, niin palaamme
        asiaan mahdollisimman pian.
      </p>

      <form action="https://httpbin.org/post" method="POST">
        <div class="form-group">
          <label for="name">Nimi *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Etunimi Sukunimi"
            required
            minlength="2"
          >
        </div>

        <div class="form-group">
          <label for="email">Sähköpostiosoite *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="esimerkki@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Puhelinnumero</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="040 123 4567"
          >
        </div>

        <div class="form-group">
          <label for="boat">Vene</label>
          <select id="boat" name="boat">
            <option value="">Valitse vene</option>
            <option value="Vene 1">Terhi 475 Twin C</option>
            <option value="Vene 2">Nordic Wave 320</option>
            <option value="Vene 3">Baltic Wind 29</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Viesti *</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Kirjoita viestisi tähän..."
            required
            minlength="5"
          ></textarea>
        </div>

        <button type="submit">Lähetä viesti</button>
      </form>
    </main>
    <footer>
      <p>
        <strong>Venekauppa Oy</strong> | Satamatie 12, 00140 Helsinki | Puh. 09
        123 4567 | myynti@venekauppa.fi
      </p>
    </footer>
    <script>
      // Tarkistetaan, onko URL-osoitteessa veneen tunniste.
      const params = new URLSearchParams(window.location.search);
      const selectedBoat = params.get("boat");

      // Valitaan oikea vene automaattisesti.
      if (selectedBoat) {
        document.getElementById("boat").value = selectedBoat;
      }
    </script>
  </body>
</html>
